<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="The Immune user guide: protect LLM applications built on OpenAI, LangChain and LangGraph." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Immune User Guide" />
    <meta property="og:description" content="Protect LLM applications built on OpenAI, LangChain and LangGraph." />
    <meta property="og:url" content="https://schwarzschlyle.github.io/immune-user-guide/" />
    <meta property="og:image" content="https://schwarzschlyle.github.io/immune-user-guide/social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Immune User Guide</title>
    <script>
      // Apply the saved or system theme before first paint, to avoid a flash of the wrong colors.
      (function () {
        try {
          var saved = localStorage.getItem("immune-guide-theme");
          var dark = saved ? saved === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.dataset.theme = dark ? "dark" : "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
